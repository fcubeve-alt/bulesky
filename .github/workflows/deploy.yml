name: Deploy to Cloudflare

on:
  workflow_dispatch: {}
  push:
    branches: [claude/lingxingkong-prd-t1x2mg]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      # A broken stylesheet does not fail a build — browsers quietly drop the
      # damaged rule and ship. That is exactly how a stray "}" once took the
      # whole top bar off the live site.
      - name: Check stylesheets parse
        run: node tools/check-css.mjs

      # The reader the desktop runner fetches on every run.
      #
      # tools/revoice.mjs imports nothing but Node built-ins, on purpose — so it
      # is one file, and one file can be served. That is what lets the runner
      # update itself: the only thing anyone ever downloads by hand is the .bat,
      # and the part that actually changes comes from here every time it runs.
      # Nothing secret is in it; the recipe is not a secret.
      - name: Publish the desktop reader
        run: |
          cp tools/revoice.mjs public/revoice.mjs
          # The runner itself, downloadable rather than hunted for in a build
          # artifact. GitHub only offers a "Run workflow" button for workflows
          # that exist on the DEFAULT branch, so the workflow that builds a
          # token-carrying runner is invisible from any other branch — which is
          # a fine way to build something nobody can obtain. A plain URL always
          # works. It ships with the token placeholder intact and asks for the
          # token once on first run, because a file anyone can download must not
          # carry a credential.
          python3 - <<'PY'
          bat = open('tools/revoice.bat', encoding='utf-8').read()
          open('public/read-the-sky.bat', 'w', encoding='utf-8', newline='\r\n').write(bat)
          PY
          echo "published /revoice.mjs ($(wc -c < public/revoice.mjs) bytes)"
          echo "published /read-the-sky.bat ($(wc -c < public/read-the-sky.bat) bytes)"

      - name: Ensure D1 database exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          npx wrangler d1 create bulesky-db || true
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="bulesky-db") | .uuid')
          if [ -z "$DB_ID" ]; then
            echo "Could not resolve bulesky-db's database_id" >&2
            exit 1
          fi
          echo "Using D1 database_id=$DB_ID"
          echo "DB_ID=$DB_ID" >> "$GITHUB_ENV"

      - name: Wire database_id into wrangler configs
        run: |
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${DB_ID}/" wrangler.toml
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${DB_ID}/" cron-worker/wrangler.toml

      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for f in migrations/*.sql; do
            # Migrations re-run on every deploy. Most are written idempotently;
            # the one exception is an ADD COLUMN (no IF NOT EXISTS in SQLite),
            # which errors with "duplicate column name" once already applied.
            # Tolerate only that specific case; fail on any other error.
            if ! out=$(npx wrangler d1 execute bulesky-db --remote --file="$f" 2>&1); then
              echo "$out"
              echo "$out" | grep -qi "duplicate column name" \
                && echo "↳ $f already applied — continuing" \
                || exit 1
            fi
          done

      # A deploy that reports success while the database is behind is worse
      # than a deploy that fails — the site then runs new code against an old
      # schema, and what the owner sees is "the new features are missing AND
      # publishing is broken". That happened: four ALTER TABLEs shared one
      # migration file, D1 rolls a whole file back on any error, and the loop
      # above only looks at output when wrangler exits non-zero.
      #
      # So the schema the code depends on is checked here, before anything is
      # deployed. Each column and table is asked for by name; a missing one
      # fails the query, fails this step, and stops the deploy while the site
      # is still serving the last working version.
      - name: Verify the database has what the code needs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          check() {
            if ! out=$(npx wrangler d1 execute bulesky-db --remote --command "$1" 2>&1); then
              echo "$out"
              echo "::error::Schema check failed: $2 — the database is behind the code. Deploy stopped."
              exit 1
            fi
            echo "  ok: $2"
          }
          check "SELECT author_hash, deleted_at FROM bubbles LIMIT 1" "bubbles.author_hash / deleted_at"
          check "SELECT author_hash, deleted_at FROM replies LIMIT 1" "replies.author_hash / deleted_at"
          check "SELECT author_hash, item_type, item_id FROM saves LIMIT 1" "saves"
          check "SELECT item_type, item_id, status, auto FROM reports LIMIT 1" "reports"
          check "SELECT bucket, window_start, count FROM rate_limits LIMIT 1" "rate_limits"

      # The bucket that holds the Listen audio. It is created by hand — in the
      # dashboard is fine, no CLI needed — and wrangler.toml binds it by NAME,
      # so a name that does not match is the one way this goes wrong.
      #
      # Pages fails the whole deploy on a binding it cannot resolve, and
      # wrangler's own error does not say what the bucket is actually called.
      # This does: it prints every bucket on the account, so one look at the log
      # is enough to fix the name. Deliberately not fatal when the listing
      # itself fails — an API token without R2 read permission is not a reason
      # to block a deploy that would otherwise work; the real bind will speak up.
      - name: Check the voice bucket exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          WANT=$(grep -A2 '^\[\[r2_buckets\]\]' wrangler.toml | sed -n 's/^bucket_name *= *"\(.*\)"/\1/p' | head -1)
          if [ -z "$WANT" ]; then
            echo "::notice::No R2 bucket configured — audio stays in D1."
            exit 0
          fi
          echo "wrangler.toml wants the bucket: $WANT"
          if ! out=$(npx wrangler r2 bucket list 2>&1); then
            echo "$out"
            echo "::warning::Could not list R2 buckets (token may lack R2 read). Continuing — the bind itself will fail loudly if the name is wrong."
            exit 0
          fi
          echo "--- buckets on this account ---"
          echo "$out"
          echo "-------------------------------"
          if echo "$out" | grep -qw -- "$WANT"; then
            echo "  ok: $WANT exists"
          else
            echo "::error::wrangler.toml binds VOICE_BUCKET to \"$WANT\", which is not in the list above. Fix bucket_name in wrangler.toml to match one of them (or create that bucket), then deploy again. Nothing was published."
            exit 1
          fi

      - name: Ensure Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages project create bulesky --production-branch=main || true

      # The blog admin (/admin.html) is locked by a single password, kept as a
      # Pages secret. Without it, /api/admin/* refuses everyone — which is the
      # right default, so a missing secret is a warning, not a failed deploy.
      - name: Sync the admin password to the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          if [ -z "${ADMIN_PASSWORD:-}" ]; then
            echo "::warning::ADMIN_PASSWORD is not set — the blog admin stays locked. Add it under Settings → Secrets and variables → Actions."
            exit 0
          fi
          printf '%s' "$ADMIN_PASSWORD" | npx wrangler pages secret put ADMIN_PASSWORD --project-name=bulesky

      # Reading whispers aloud. Without this the Listen button still works, but
      # falls back to the browser's own flat synthesis instead of the directed,
      # emotional reading the feature exists for — so a missing key is a warning
      # rather than a failed deploy.
      - name: Sync the text-to-speech key to the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::warning::OPENAI_API_KEY is not set — Listen falls back to the browser's robotic voice. Add it under Settings → Secrets and variables → Actions."
            exit 0
          fi
          printf '%s' "$OPENAI_API_KEY" | npx wrangler pages secret put OPENAI_API_KEY --project-name=bulesky

      # The door the site's own voice comes in through
      # (docs/CURRENT_AUDIO_ARCHITECTURE.md §9). The brand readings are made on
      # the owner's machine, where VoiceStudio is, and posted to
      # /api/voice/backfill; this is what that endpoint checks.
      #
      # Its own secret on purpose, NOT ADMIN_PASSWORD: it goes into a shell
      # history and a script on a desktop, and has to be revocable on its own
      # without locking anyone out of moderation. Unset, the endpoint is simply
      # closed and every other part of Listen carries on unchanged — so a
      # missing token is a warning, not a failed deploy.
      - name: Sync the voice upload token to the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VOICE_UPLOAD_TOKEN: ${{ secrets.VOICE_UPLOAD_TOKEN }}
        run: |
          if [ -z "${VOICE_UPLOAD_TOKEN:-}" ]; then
            echo "::warning::VOICE_UPLOAD_TOKEN is not set — /api/voice/backfill stays closed, so readings made on the owner's machine cannot be uploaded. Add it under Settings → Secrets and variables → Actions."
            exit 0
          fi
          printf '%s' "$VOICE_UPLOAD_TOKEN" | npx wrangler pages secret put VOICE_UPLOAD_TOKEN --project-name=bulesky

      # ElevenLabs, when there is a key for it. This is the provider the Listen
      # button prefers: a plain HTTPS call rather than a platform binding, and
      # the one that actually reads with feeling.
      - name: Sync the ElevenLabs key to the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          if [ -z "${ELEVENLABS_API_KEY:-}" ]; then
            echo "::warning::ELEVENLABS_API_KEY is not set — Listen falls back to the free Workers AI voice."
            exit 0
          fi
          printf '%s' "$ELEVENLABS_API_KEY" | npx wrangler pages secret put ELEVENLABS_API_KEY --project-name=bulesky

      # Two secrets, one provider. Both must be present or it is not configured
      # at all — appid without a token is a request that gets refused, which
      # would show up as a broken voice rather than as an absent one.
      - name: Sync the Volcengine speech credentials to the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VOLC_APPID: ${{ secrets.VOLC_APPID }}
          VOLC_ACCESS_TOKEN: ${{ secrets.VOLC_ACCESS_TOKEN }}
        run: |
          if [ -z "${VOLC_APPID:-}" ] || [ -z "${VOLC_ACCESS_TOKEN:-}" ]; then
            echo "::notice::Volcengine speech is not configured — set VOLC_APPID and VOLC_ACCESS_TOKEN to enable it."
            exit 0
          fi
          printf '%s' "$VOLC_APPID" | npx wrangler pages secret put VOLC_APPID --project-name=bulesky
          printf '%s' "$VOLC_ACCESS_TOKEN" | npx wrangler pages secret put VOLC_ACCESS_TOKEN --project-name=bulesky

      # Optional, and only meaningful alongside OPENAI_API_KEY. A relay that
      # speaks OpenAI's dialect needs its host here; OPENAI_TTS_MODEL is for
      # relays that carry only the older tts-1.
      - name: Sync the OpenAI endpoint overrides to the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          OPENAI_TTS_MODEL: ${{ secrets.OPENAI_TTS_MODEL }}
        run: |
          if [ -n "${OPENAI_BASE_URL:-}" ]; then
            printf '%s' "$OPENAI_BASE_URL" | npx wrangler pages secret put OPENAI_BASE_URL --project-name=bulesky
          fi
          if [ -n "${OPENAI_TTS_MODEL:-}" ]; then
            printf '%s' "$OPENAI_TTS_MODEL" | npx wrangler pages secret put OPENAI_TTS_MODEL --project-name=bulesky
          fi

      # Google AI Studio. The one provider with a free allowance that does not
      # ask for a card, which for this project decides whether there is a voice
      # at all.
      - name: Sync the Gemini key to the Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL }}
        run: |
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "::notice::Gemini speech is not configured — set GEMINI_API_KEY to enable it."
            exit 0
          fi
          printf '%s' "$GEMINI_API_KEY" | npx wrangler pages secret put GEMINI_API_KEY --project-name=bulesky
          if [ -n "${GEMINI_TTS_MODEL:-}" ]; then
            printf '%s' "$GEMINI_TTS_MODEL" | npx wrangler pages secret put GEMINI_TTS_MODEL --project-name=bulesky
          fi

      # The stamp a phone compares itself against. Has to change every deploy —
      # a fixed one makes every stale install look current, which is the exact
      # failure the stamp exists to catch.
      - name: Stamp the build
        run: node tools/stamp-build.mjs

      - name: Deploy Pages project (frontend + API)
        id: pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler pages deploy public --project-name=bulesky --commit-dirty=true --branch=main

      # Did the bindings actually take?
      #
      # `wrangler pages deploy` prints no binding table — unlike a Worker deploy,
      # which lists every one — so a deploy that succeeded tells you nothing about
      # whether VOICE_BUCKET resolved. The site's own probe does: it reports which
      # store finished readings are written to. This is the difference between
      # "the deploy was green" and "the change is live", which this project has
      # now spent several rounds confusing.
      #
      # Never fatal. The site is already published by this point, propagation is
      # not instant, and a probe that cannot be reached is not a reason to mark a
      # good deploy failed. It is here to put the truth in the log.
      - name: Report which store the live site is using
        continue-on-error: true
        run: |
          sleep 10
          out=$(curl -fsS --max-time 20 "https://cubewithin.com/api/voice/1?probe=1" || true)
          if [ -z "$out" ]; then
            echo "::warning::Could not reach the probe — skipping the check."
            exit 0
          fi
          store=$(echo "$out" | sed -n 's/.*"store": *"\([a-z0-9]*\)".*/\1/p' | head -1)
          echo "live store = ${store:-unknown}"
          if [ "$store" = "r2" ]; then
            echo "  ok: finished readings are being written to R2"
          else
            echo "$out" | head -40
            echo "::warning::Live store is \"${store:-unknown}\", not r2 — the VOICE_BUCKET binding did not take. Audio is still going into D1. Bind it in the Pages dashboard (Settings → Functions → R2 bucket bindings: VOICE_BUCKET → bulesky-voice) if wrangler.toml is not enough for this project."
          fi

      - name: Deploy retention-cleanup worker
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config cron-worker/wrangler.toml
