name: Write a blog post

# One post each weekday morning, from the articles in content/posts/.
#
# These used to be generated by Cloudflare Workers AI. That never worked once
# from CI — the API token is refused and the fix is on the Cloudflare account,
# not in this repository — so the articles are written into the repo instead and
# this only publishes them. That also makes them better: a small free model
# writing about grief produces exactly what it sounds like.
#
# Needs one secret, ADMIN_PASSWORD, which already works. No model, no AI token,
# no quota, nothing that can be rate limited.
on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Save as a draft instead of publishing"
        type: boolean
        default: false
  schedule:
    - cron: "20 6 * * 1-5" # weekdays 06:20 UTC

permissions:
  contents: read

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # No deploy needed: posts live in D1, not in the repository, so a new
      # article is live the moment it is published.
      - name: Publish the next article
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          DRAFT: ${{ inputs.draft && '1' || '0' }}
        run: node tools/publish-post.mjs
