name: Clear the voice cache

# Throw away every generated reading so the next listen regenerates from
# scratch.
#
# This exists because "is what I am hearing the new voice or an old cached one?"
# is impossible to answer from the outside, and an unanswerable question makes
# judging a change impossible. A clean slate is sometimes the only way to hear
# what you actually changed.
#
# It is destructive and it costs real quota to refill — every whisper anyone
# opens afterwards is synthesised again — so it asks to be typed at rather than
# clicked.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type DELETE to wipe every cached reading'
        required: true
        default: ''
      also_errors:
        description: 'Also clear the failure log'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  clear:
    runs-on: ubuntu-latest
    steps:
      - name: Check the confirmation
        run: |
          if [ "${{ inputs.confirm }}" != "DELETE" ]; then
            echo "::error::Confirmation not given — nothing was deleted."
            exit 1
          fi

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install

      - name: Wire database_id into wrangler config
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -e
          DB_ID=$(npx wrangler d1 list --json | jq -r '.[] | select(.name=="bulesky-db") | .uuid')
          [ -n "$DB_ID" ] || { echo "could not resolve bulesky-db" >&2; exit 1; }
          sed -i "s/REPLACE_WITH_YOUR_D1_DATABASE_ID/${DB_ID}/" wrangler.toml

      - name: Count what is about to go
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute bulesky-db --remote \
            --command "SELECT COUNT(DISTINCT hash) AS readings, COUNT(*) AS chunks, SUM(LENGTH(data)) AS bytes FROM voice_chunks"

      - name: Delete every cached reading
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute bulesky-db --remote --command "DELETE FROM voice_chunks"

      - name: Clear the failure log
        if: ${{ inputs.also_errors }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 execute bulesky-db --remote --command "DELETE FROM voice_errors"

      - name: Confirm it is empty
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler d1 execute bulesky-db --remote \
            --command "SELECT COUNT(*) AS chunks_left FROM voice_chunks"
