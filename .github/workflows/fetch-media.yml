name: Fetch background media

# Pulls license-safe free media (public-domain ambient music from the
# Internet Archive; scenery video from Pixabay when PIXABAY_API_KEY is set),
# commits it into the libraries, and triggers a deploy. Runs on demand and
# weekly so the sky slowly gains new scenery/music over time.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # Work on whichever branch this run was started from, so a dispatch on a
      # feature branch fetches into THAT branch and deploys THAT branch. The
      # ref used to be hardcoded, which meant a media run could quietly deploy
      # a different branch's code over whatever was live.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch media
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: node tools/fetch-media.js

      - name: Commit new media
        id: commit
        run: |
          git config user.name "bulesky-bot"
          git config user.email "noreply@anthropic.com"
          git add public/music public/video
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new media."
          else
            git commit -m "chore: auto-fetch background media"
            git push origin "${{ github.ref_name }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
