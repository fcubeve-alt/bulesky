name: Fetch background media

# Pulls license-safe free media (public-domain ambient music from the
# Internet Archive; scenery video from Pixabay when PIXABAY_API_KEY is set),
# commits it into the libraries, and triggers a deploy, so the sky slowly gains
# new scenery/music over time.
#
# It runs early on Monday so that the assistant's Monday routine, which fires
# about two hours later, reviews what it brought in. This script has no taste:
# it cannot tell that a track is somebody reading aloud rather than music, or
# that a transfer is too noisy to sit under a night sky, and both of those
# reached the live site and had to be caught by ear. The fetch stays here (it
# holds the API keys); the judging happens after it.
#
# Moving this time means moving the routine too, or the routine reviews last
# week's fetch.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 0 * * 1" # Mondays 00:17 UTC — 08:17 Beijing

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      # Work on whichever branch this run was started from, so a dispatch on a
      # feature branch fetches into THAT branch and deploys THAT branch. The
      # ref used to be hardcoded, which meant a media run could quietly deploy
      # a different branch's code over whatever was live.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch media
        env:
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          JAMENDO_CLIENT_ID: ${{ secrets.JAMENDO_CLIENT_ID }}
        run: node tools/fetch-media.js

      # Stock clips arrive at broadcast bitrates — one 12-second river clip came
      # in at 1920x1080, 16.4 Mbps, 24MB, for something that plays muted behind
      # a scrim. Without this step every weekly fetch would slowly undo the work
      # of making the site open quickly. ffmpeg is preinstalled on the runner.
      - name: Shrink new scenery clips
        run: node tools/shrink-video.mjs

      - name: Commit new media
        id: commit
        run: |
          git config user.name "bulesky-bot"
          git config user.email "noreply@anthropic.com"
          git add public/music public/video
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new media."
          else
            git commit -m "chore: auto-fetch background media"
            git push origin "${{ github.ref_name }}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger deploy
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/deploy.yml/dispatches" \
            -d "{\"ref\":\"${{ github.ref_name }}\"}"
