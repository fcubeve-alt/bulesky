<!--
  The app icon: one lantern-balloon rising in the night.

  Full-bleed square with NO rounded corners and NO transparency, because that
  is what the App Store requires — iOS applies its own mask, and a corner
  radius baked in here comes out as a dark ring around the icon on the home
  screen. The web manifest and the Android version are generated from this same
  drawing (tools/make-icons.mjs), so there is one picture to change, not five.

  One balloon, not a field of them. At 40px on a home screen a sky full of
  small ones is a smudge; the whole icon has to survive being a thumbnail, so
  it is a single warm shape against a deep blue with as much contrast as the
  palette allows. The stars and the water below are there at 1024 and simply
  disappear at 40 — which is the correct behaviour for detail, rather than
  detail that turns into noise.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="night" cx="42%" cy="26%" r="86%">
      <stop offset="0%" stop-color="#1d2450"/>
      <stop offset="55%" stop-color="#0e1330"/>
      <stop offset="100%" stop-color="#05060f"/>
    </radialGradient>
    <!-- Same spherical shading the balloons in the sky use: a lit crown
         top-left falling to a dark bottom edge, so it reads as a canopy with
         volume rather than a flat disc. -->
    <radialGradient id="canopy" cx="34%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#fffdf5"/>
      <stop offset="26%" stop-color="#ffdd97"/>
      <stop offset="68%" stop-color="#ff9d4e"/>
      <stop offset="100%" stop-color="#c9661f"/>
    </radialGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffb066" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#ff9d4e" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ff9d4e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1332" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0a1030" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#night)"/>

  <!-- Stars. Detail for the 1024 render; invisible and harmless at 40px. -->
  <g fill="#ffffff">
    <circle cx="176" cy="150" r="5" opacity="0.75"/>
    <circle cx="828" cy="122" r="4" opacity="0.6"/>
    <circle cx="880" cy="330" r="5.5" opacity="0.7"/>
    <circle cx="128" cy="392" r="4" opacity="0.5"/>
    <circle cx="762" cy="612" r="3.5" opacity="0.45"/>
    <circle cx="262" cy="676" r="3" opacity="0.4"/>
    <circle cx="612" cy="196" r="3" opacity="0.5"/>
  </g>

  <!-- The lake, so the balloon is rising FROM somewhere. -->
  <rect x="0" y="812" width="1024" height="212" fill="url(#water)"/>
  <g fill="#8fb6ff" opacity="0.16">
    <rect x="380" y="872" width="264" height="7" rx="3.5"/>
    <rect x="424" y="916" width="176" height="6" rx="3"/>
    <rect x="452" y="956" width="120" height="5" rx="2.5"/>
  </g>

  <circle cx="512" cy="452" r="330" fill="url(#halo)"/>

  <!-- Canopy: round on top, drawn in toward the mouth — a balloon envelope,
       not a ball. -->
  <path
    d="M512 168
       c126 0 228 100 228 224
       0 92 -62 168 -112 214
       -30 28 -66 48 -116 48
       -50 0 -86 -20 -116 -48
       -50 -46 -112 -122 -112 -214
       0 -124 102 -224 228 -224 z"
    fill="url(#canopy)"/>
  <!-- Panel seams, the vertical gores of a real canopy. -->
  <g stroke="#ffffff" stroke-opacity="0.22" stroke-width="3" fill="none">
    <path d="M512 168 C 470 300 470 470 512 654"/>
    <path d="M512 168 C 554 300 554 470 512 654"/>
    <path d="M400 206 C 384 320 400 470 452 630"/>
    <path d="M624 206 C 640 320 624 470 572 630"/>
  </g>
  <!-- Specular highlight. -->
  <ellipse cx="438" cy="266" rx="62" ry="44" fill="#ffffff" opacity="0.5" transform="rotate(-24 438 266)"/>

  <!-- Rigging and basket. -->
  <g stroke="#e2c19a" stroke-width="8" stroke-linecap="round">
    <path d="M452 630 L 470 712"/>
    <path d="M572 630 L 554 712"/>
  </g>
  <rect x="456" y="706" width="112" height="74" rx="16" fill="#8a5a2b"/>
  <rect x="456" y="706" width="112" height="28" rx="14" fill="#a9702f"/>
  <g stroke="#6b431f" stroke-width="5" opacity="0.8">
    <path d="M494 712 L 494 776"/>
    <path d="M530 712 L 530 776"/>
  </g>
</svg>
