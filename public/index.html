<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070a18" />
<meta name="description" content="A borderless, anonymous night lake where whispers drift as lanterns." />
<title>心灵星空</title>
<link rel="canonical" href="https://cubewithin.com/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="心灵星空" />
<meta property="og:title" content="心灵星空" />
<meta property="og:description" content="A borderless, anonymous night lake where whispers drift as lanterns." />
<meta property="og:url" content="https://cubewithin.com/" />
<meta property="og:image" content="https://cubewithin.com/icons/icon.svg" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="心灵星空" />
<meta name="twitter:description" content="A borderless, anonymous night lake where whispers drift as lanterns." />
<meta name="twitter:image" content="https://cubewithin.com/icons/icon.svg" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon.svg" />
<link rel="icon" href="/icons/icon.svg" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- Background: a crossfade playlist of scenery videos over a dark fallback.
     Two stacked layers alternate so clips dissolve into one another. -->
<video id="bg-video-a" class="bg-video hidden" muted playsinline autoplay preload="auto" aria-hidden="true"></video>
<video id="bg-video-b" class="bg-video hidden" muted playsinline autoplay preload="auto" aria-hidden="true"></video>
<div id="bg-scrim" class="hidden" aria-hidden="true"></div>
<div id="sky-bg" aria-hidden="true"></div>

<!-- Whispers, as drifting lanterns (world pans horizontally when crowded) -->
<div id="lanterns" aria-live="polite"><div id="world"></div></div>

<!-- Top bar -->
<header class="top-bar">
  <span id="app-title" class="brand"></span>
  <div class="top-icons">
    <button id="bg-icon" class="icon-btn" aria-label="Switch background">🏔️</button>
    <button id="music-icon" class="icon-btn" aria-label="Toggle music" aria-pressed="false">♪</button>
    <button id="find-icon" class="icon-btn" aria-label="Find my whispers">🔍</button>
    <button id="share-icon" class="icon-btn" aria-label="Scan to open">▦</button>
    <button id="coffee-icon" class="icon-btn" aria-label="Buy a coffee">☕</button>
  </div>
</header>

<!-- Mini panels -->
<div id="find-panel" class="mini-panel hidden">
  <button class="mini-close" id="find-close" aria-label="Close">×</button>
  <label id="find-label" for="find-input"></label>
  <div class="mini-panel-row">
    <input id="find-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
    <button id="find-submit" class="btn-primary btn-small"></button>
  </div>
  <div id="find-result" class="find-result"></div>
</div>

<div id="share-panel" class="mini-panel hidden">
  <button class="mini-close" id="share-close" aria-label="Close">×</button>
  <p id="share-title" class="music-now"></p>
  <img id="share-qr" class="share-qr" src="/qr.png" alt="QR code" width="180" height="180" />
  <p id="share-hint" class="hint"></p>
  <div class="mini-panel-row">
    <button id="share-copy" class="btn-primary btn-small"></button>
  </div>
</div>

<div id="coffee-panel" class="mini-panel hidden">
  <button class="mini-close" id="coffee-close" aria-label="Close">×</button>
  <p id="coffee-text"></p>
  <a id="coffee-link" class="btn-primary btn-small" href="https://ko-fi.com/" target="_blank" rel="noopener noreferrer"></a>
</div>

<div id="bg-panel" class="mini-panel hidden">
  <button class="mini-close" id="bg-close" aria-label="Close">×</button>
  <p id="bg-now" class="music-now"></p>
  <div class="mini-panel-row">
    <button id="bg-next" class="btn-primary btn-small"></button>
    <button id="bg-auto" class="btn-secondary btn-small"></button>
  </div>
  <p id="bg-note" class="hint"></p>
</div>

<div id="music-panel" class="mini-panel hidden">
  <button class="mini-close" id="music-close" aria-label="Close">×</button>
  <p id="music-now" class="music-now"></p>
  <a id="music-credit" class="hint music-credit" target="_blank" rel="noopener noreferrer"></a>
  <div class="mini-panel-row">
    <button id="music-toggle" class="btn-primary btn-small"></button>
    <button id="music-next" class="btn-secondary btn-small"></button>
  </div>
  <p id="music-note" class="hint"></p>
</div>

<!-- Now-playing strip (subtle, above the bottom bar) -->
<div id="now-playing" class="now-playing hidden" aria-hidden="true"></div>

<!-- Bottom invitation -->
<nav class="bottom-bar">
  <button id="entry-pain" class="bottom-btn" data-type="pain"></button>
  <button id="entry-wish" class="bottom-btn" data-type="wish"></button>
</nav>

<!-- Compose sheet -->
<div id="compose-overlay" class="overlay hidden"></div>
<section id="compose-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="compose-title">
  <div class="sheet-handle"></div>
  <button class="mini-close sheet-close" id="compose-close" aria-label="Close">×</button>
  <h2 id="compose-title"></h2>
  <div id="crisis-banner" class="crisis-banner hidden"><p id="crisis-text"></p></div>
  <textarea id="compose-content" rows="4" maxlength="500"></textarea>
  <div id="compose-count" class="char-count">0/500</div>
  <label id="compose-code-label" for="compose-code"></label>
  <input id="compose-code" type="text" maxlength="25" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
  <p id="compose-code-hint" class="hint"></p>
  <input id="compose-hp" type="text" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true" />
  <div id="compose-error" class="form-error hidden"></div>
  <div class="sheet-actions">
    <button id="compose-cancel" class="btn-secondary"></button>
    <button id="compose-submit" class="btn-primary"></button>
  </div>
</section>

<!-- Confirmation -->
<div id="confirm-overlay" class="overlay hidden"></div>
<section id="confirm-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-message">
  <p id="confirm-message"></p>
  <div class="code-display">
    <span id="confirm-code"></span>
    <button id="confirm-copy" class="btn-small btn-secondary"></button>
  </div>
  <p id="confirm-hint" class="hint"></p>
  <button id="confirm-close" class="btn-primary"></button>
</section>

<!-- Whisper detail -->
<div id="detail-overlay" class="overlay hidden"></div>
<section id="detail-sheet" class="sheet detail-sheet hidden" role="dialog" aria-modal="true">
  <button class="mini-close sheet-close" id="detail-close" aria-label="Close">×</button>
  <div id="detail-content" class="detail-content"></div>
  <button id="detail-report" class="link-btn"></button>
  <h3 id="detail-replies-title"></h3>
  <div id="detail-replies" class="detail-replies"></div>
  <label id="reply-label" for="reply-content"></label>
  <textarea id="reply-content" rows="3" maxlength="300"></textarea>
  <div id="reply-error" class="form-error hidden"></div>
  <button id="reply-submit" class="btn-primary"></button>
</section>

<!-- iOS install guide -->
<div id="ios-overlay" class="overlay hidden"></div>
<section id="ios-modal" class="sheet hidden" role="dialog" aria-modal="true">
  <h2 id="ios-title"></h2>
  <p id="ios-body"></p>
  <button id="ios-close" class="btn-primary"></button>
</section>

<div id="toast" class="toast hidden" role="status"></div>

<script type="module" src="/js/i18n.js"></script>
<script type="module" src="/js/scene.js"></script>
<script type="module" src="/js/ambient.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
