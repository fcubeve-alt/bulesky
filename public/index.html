<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070a18" />
<meta name="description" content="A borderless, anonymous night lake where whispers drift as lanterns." />
<title>Are you all right?</title>
<link rel="canonical" href="https://cubewithin.com/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Are you all right?" />
<meta property="og:title" content="Are you all right?" />
<meta property="og:description" content="A borderless, anonymous night lake where whispers drift as lanterns." />
<meta property="og:url" content="https://cubewithin.com/" />
<meta property="og:image" content="https://cubewithin.com/icons/icon.svg" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Are you all right?" />
<meta name="twitter:description" content="A borderless, anonymous night lake where whispers drift as lanterns." />
<meta name="twitter:image" content="https://cubewithin.com/icons/icon.svg" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<link rel="manifest" href="/manifest.json" />
<link rel="apple-touch-icon" href="/icons/icon.svg" />
<link rel="icon" href="/icons/icon.svg" />
<link rel="stylesheet" href="/css/style.css?v=read34" />
</head>
<body>

<!-- Background: a crossfade playlist of scenery videos over a dark fallback.
     Two stacked layers alternate so clips dissolve into one another. -->
<!-- preload="none" on purpose. These clips average ~9MB (the largest is 24MB),
     and "auto" told the browser to swallow whole files before the page was even
     usable — a cold visit pulled 67–159MB in its first seconds and the video
     still never reached a playable state on a 4G phone. backgrounds.js sets
     .src and calls play()/load() itself, so nothing here needs preloading. -->
<video id="bg-video-a" class="bg-video hidden" muted playsinline autoplay preload="none" aria-hidden="true"></video>
<video id="bg-video-b" class="bg-video hidden" muted playsinline autoplay preload="none" aria-hidden="true"></video>
<div id="bg-scrim" class="hidden" aria-hidden="true"></div>
<div id="sky-bg" aria-hidden="true"></div>

<!-- Whispers, as drifting lanterns (world pans horizontally when crowded) -->
<div id="lanterns" aria-live="polite"><div id="world"></div></div>

<!-- Top bar -->
<header class="top-bar">
  <span id="app-title" class="brand"></span>
  <div class="top-icons">
    <button id="bg-icon" class="icon-btn" aria-label="Switch background">🏔️</button>
    <button id="music-icon" class="icon-btn" aria-label="Toggle music" aria-pressed="false">♪</button>
    <button id="find-icon" class="icon-btn" aria-label="Find my whispers">🔍</button>
    <button id="share-icon" class="icon-btn" aria-label="Scan to open">▦</button>
    <!-- Not a coffee cup any more: the ask is the site's running costs, not a
         personal favour to whoever built it. ♡ rather than ✦, which already
         means "wish" everywhere else in this sky. -->
    <button id="coffee-icon" class="icon-btn" aria-label="Help keep the sky running">♡</button>
    <button id="about-icon" class="icon-btn" aria-label="About this sky">ⓘ</button>
  </div>
</header>

<!-- Way out to the official pages, from inside the sky. The footer links at
     the bottom are easy to miss; this is the findable one. -->
<div id="about-panel" class="mini-panel hidden">
  <button class="mini-close" id="about-close" aria-label="Close">×</button>
  <p id="about-panel-text" class="hint"></p>
  <nav class="panel-links">
    <a href="/about.html">About</a>
    <a href="/principles.html">Community principles</a>
    <a href="/privacy.html">Privacy</a>
    <a href="/blog/">Blog</a>
  </nav>
</div>

<!-- Mini panels -->
<!-- My Sky. What you wrote and what you kept, found by the secret this device
     holds rather than by a name anyone could type. The name lookup stays at the
     bottom for whoever lost their code and still remembers what they signed. -->
<div id="find-panel" class="mini-panel hidden">
  <button class="mini-close" id="find-close" aria-label="Close">×</button>
  <!-- The panel says what it is before it lists anything. Without this it
       reads as a search box with two mysterious lists above it, and the one
       thing people need to know — that this follows the phone, not the name
       you signed with — is the thing nothing was saying. -->
  <p id="mysky-title" class="music-now"></p>
  <p id="mysky-intro" class="hint"></p>
  <div id="mysky"></div>
  <p id="mysky-msg" class="hint"></p>

  <!-- The recovery code, on demand. It used to be shown once, on the very
       first whisper, and then never again anywhere — so anyone who did not
       write it down that minute had no way to get it, and the box below asking
       them to paste it was asking for something that did not exist. Folded
       shut because it is a thing you fetch when you need it, not something to
       leave lying open on a shared screen. -->
  <details id="recovery-box" class="result-group">
    <summary id="recovery-summary" class="find-results-title"></summary>
    <p id="recovery-note" class="hint"></p>
    <code id="my-recovery" class="recovery-code"></code>
    <div class="mini-panel-row">
      <button id="my-recovery-copy" class="btn-secondary btn-small"></button>
    </div>
    <!-- Reading your code out and typing someone else's in are the same
         subject, so they live under the same heading. Kept apart they were two
         more permanently-open rows in a panel that is supposed to open as four
         quiet lines. -->
    <label id="restore-label" for="restore-input"></label>
    <div class="mini-panel-row">
      <input id="restore-input" type="text" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" />
      <button id="restore-submit" class="btn-secondary btn-small"></button>
    </div>
  </details>

  <!-- Searching by name is a fallback, and it is folded away as one.
       It used to sit here as a labelled box with its own button, level with
       "what I wrote" and "what I kept", which made it look like a third thing
       this panel is for. It is not: this panel is your own sky, and your own
       sky follows the device. The search still has to exist, because it is the
       only way back for whispers written before this device had an identity,
       or from a phone whose recovery code was never saved — but it is read
       only, it cannot prove anyone is anyone, and it belongs at the bottom
       behind a fold. -->
  <details id="find-box" class="result-group">
    <summary id="find-summary" class="find-results-title"></summary>
    <p id="find-note" class="hint"></p>
    <div class="mini-panel-row">
      <input id="find-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
      <button id="find-submit" class="btn-secondary btn-small"></button>
    </div>
    <div id="find-result" class="find-result"></div>
  </details>
</div>

<div id="share-panel" class="mini-panel hidden">
  <button class="mini-close" id="share-close" aria-label="Close">×</button>
  <p id="share-title" class="music-now"></p>
  <img id="share-qr" class="share-qr" src="/qr.png" alt="QR code" width="180" height="180" />
  <p id="share-hint" class="hint"></p>
  <div class="mini-panel-row">
    <button id="share-copy" class="btn-primary btn-small"></button>
  </div>
</div>

<div id="coffee-panel" class="mini-panel hidden">
  <button class="mini-close" id="coffee-close" aria-label="Close">×</button>
  <p id="coffee-text"></p>
  <a id="coffee-link" class="btn-primary btn-small" href="https://ko-fi.com/" target="_blank" rel="noopener noreferrer"></a>
</div>

<div id="bg-panel" class="mini-panel hidden">
  <button class="mini-close" id="bg-close" aria-label="Close">×</button>
  <p id="bg-now" class="music-now"></p>
  <div class="mini-panel-row">
    <button id="bg-next" class="btn-primary btn-small"></button>
    <button id="bg-auto" class="btn-secondary btn-small"></button>
  </div>
  <p id="bg-note" class="hint"></p>
</div>

<div id="music-panel" class="mini-panel hidden">
  <button class="mini-close" id="music-close" aria-label="Close">×</button>
  <p id="music-now" class="music-now"></p>
  <a id="music-credit" class="hint music-credit" target="_blank" rel="noopener noreferrer"></a>
  <div class="mini-panel-row">
    <button id="music-toggle" class="btn-primary btn-small"></button>
    <button id="music-next" class="btn-secondary btn-small"></button>
  </div>
  <p id="music-note" class="hint"></p>
</div>

<!-- Now-playing strip (subtle, above the bottom bar) -->
<div id="now-playing" class="now-playing hidden" aria-hidden="true"></div>

<!-- Bottom invitation -->
<nav class="bottom-bar">
  <div class="bottom-actions">
    <button id="entry-pain" class="bottom-btn" data-type="pain"></button>
    <button id="entry-wish" class="bottom-btn" data-type="wish"></button>
  </div>
  <!-- Quiet footer to the official pages. English on purpose: the pages
       themselves are English, so a localized label would mislead. -->
  <p class="site-links">
    <a href="/about.html">About</a>
    <a href="/principles.html">Principles</a>
    <a href="/privacy.html">Privacy</a>
    <a href="/blog/">Blog</a>
  </p>
</nav>

<!-- Compose sheet -->
<div id="compose-overlay" class="overlay hidden"></div>
<section id="compose-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="compose-title">
  <div class="sheet-handle"></div>
  <button class="mini-close sheet-close" id="compose-close" aria-label="Close">×</button>
  <div id="compose-title" class="cx-lead"></div>
  <p id="compose-sub" class="cx-sub"></p>
  <!-- Always on while composing a sorrow — never triggered by keywords, so it
       is there before the first word rather than after it. -->
  <div id="crisis-banner" class="crisis-banner hidden">
    <p id="crisis-text"></p>
    <a id="crisis-link" href="https://findahelpline.com" target="_blank" rel="noopener noreferrer"></a>
  </div>
  <div class="field">
    <textarea id="compose-content" class="big-input" rows="4" maxlength="1000"></textarea>
    <span id="compose-count" class="field-count">0 / 1000</span>
  </div>
  <div class="name-field">
    <span id="compose-code-label" class="chip"></span>
    <input id="compose-code" type="text" maxlength="25" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
  </div>
  <input id="compose-hp" type="text" class="honeypot" tabindex="-1" autocomplete="off" aria-hidden="true" />
  <p id="compose-public-hint" class="cx-hint"></p>
  <div id="compose-error" class="form-error hidden"></div>
  <div class="cx-actions">
    <button type="button" id="compose-cancel" class="cx-cancel"></button>
    <button type="button" id="compose-submit" class="cx-send"></button>
  </div>
</section>

<!-- Confirmation -->
<div id="confirm-overlay" class="overlay hidden"></div>
<section id="confirm-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="confirm-message">
  <p id="confirm-message"></p>
  <div class="code-display">
    <span id="confirm-code"></span>
    <button id="confirm-copy" class="btn-small btn-secondary"></button>
  </div>
  <p id="confirm-hint" class="hint"></p>
  <!-- Shown once, on the first whisper this device ever sends. There is no
       account to fall back on, so this string is the only way to reach your own
       words from another phone — and the only thing that can delete them. -->
  <div id="recovery-block" class="code-display hidden">
    <span id="recovery-label" class="chip"></span>
    <span id="recovery-code"></span>
    <button id="recovery-copy" class="btn-small btn-secondary"></button>
  </div>
  <p id="recovery-hint" class="hint"></p>
  <button id="confirm-close" class="btn-primary"></button>
</section>

<!-- Whisper read view: transparent, credits-style upward scroll -->
<div id="read-overlay" class="read-overlay hidden" role="dialog" aria-modal="true">
  <div class="read-viewport">
    <div id="read-scroll" class="read-scroll">
      <div id="read-content" class="read-content"></div>
      <!-- Byline + report, laid out exactly like a reply's: the report sits
           next to the name it belongs to, not adrift in the action bar. -->
      <div class="read-byline">
        <div id="read-author" class="read-author"></div>
        <button id="read-report-btn" class="report-pill"></button>
        <!-- Only the author sees this, and only because the server said so. -->
        <button id="read-delete-btn" class="report-pill hidden"></button>
        <!-- Keeping, not copying: this stores a reference, so the story leaves
             your shelf the moment its author takes it back. Never shown on your
             own whisper — that one is already yours. -->
        <button id="read-save-btn" class="report-pill hidden"></button>
        <!-- Only the author may take their own words off-site. Somebody else's
             story stays here, where they can still take it back. -->
        <button id="read-share-btn" class="report-pill hidden"></button>
      </div>
      <h3 id="detail-replies-title" class="read-replies-title"></h3>
      <div id="read-replies" class="read-replies"></div>
    </div>
  </div>
  <button class="read-close" id="read-close" aria-label="Close">×</button>

  <!-- Listen rides at the top, over the text rather than under it. Down in the
       action bar it was the third of three buttons at the bottom of a screen
       nobody was looking at, which is a strange place to put the alternative to
       reading. Dismissable, because an offer that cannot be declined is a
       nag. -->
  <div id="listen-dock" class="listen-dock hidden">
    <button id="read-listen-btn" class="listen-btn"></button>
    <button id="listen-dismiss" class="listen-dismiss" aria-label="Hide">×</button>
  </div>

  <div class="read-actions">
    <!-- Held back until the whisper has nearly finished rising. Sitting there
         from the first second, it was read as furniture and missed entirely —
         an invitation only lands once you have heard the thing it is inviting
         you to answer. -->
    <p id="read-invite" class="read-invite hidden"><span id="read-invite-text"></span><span class="invite-arrow" aria-hidden="true">↓</span></p>
    <button id="read-light-btn" class="btn-secondary btn-small light-btn"></button>
    <button id="read-reply-btn" class="btn-primary btn-small"></button>
  </div>
</div>

<!-- Why you are reporting this.
     One tap used to file a report that said nothing, so the queue showed a
     number and no reason — and whoever reviews it had to guess what the
     complaint even was. Five buttons, no typing: the reasons are the
     categories the rules are written in, so the queue can be read by
     category and the filters can be improved from what actually gets
     reported. "Cancel" is a real option; a report you cannot back out of is
     a trap on a button people press by accident. -->
<div id="report-overlay" class="overlay hidden"></div>
<section id="report-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="report-title">
  <div class="sheet-handle"></div>
  <p id="report-title" class="sheet-title"></p>
  <div class="report-reasons">
    <button class="btn-secondary report-reason" data-reason="attack"></button>
    <button class="btn-secondary report-reason" data-reason="self-harm"></button>
    <button class="btn-secondary report-reason" data-reason="spam"></button>
    <button class="btn-secondary report-reason" data-reason="sexual"></button>
    <button class="btn-secondary report-reason" data-reason="other"></button>
  </div>
  <button id="report-cancel" class="btn-secondary btn-small"></button>
</section>

<!-- Reply input (small sheet, opened from the read view) -->
<div id="reply-overlay" class="overlay hidden"></div>
<section id="reply-sheet" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="reply-label">
  <div class="sheet-handle"></div>
  <button class="mini-close sheet-close" id="reply-close" aria-label="Close">×</button>
  <div class="reply-lead"><span class="q">🤍</span><p id="reply-label"></p></div>
  <div class="field">
    <textarea id="reply-content" class="big-input" rows="3" maxlength="150"></textarea>
    <span id="reply-count" class="field-count">0 / 150</span>
  </div>
  <div class="name-field">
    <span id="reply-code-label" class="chip"></span>
    <input id="reply-code" type="text" maxlength="25" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" />
  </div>
  <div id="reply-error" class="form-error hidden"></div>
  <button id="reply-submit" class="cx-send"></button>
</section>

<!-- First-visit notice: public content + reposting rights -->
<div id="notice-overlay" class="overlay hidden"></div>
<section id="notice-modal" class="sheet hidden" role="dialog" aria-modal="true" aria-labelledby="notice-title">
  <h2 id="notice-title"></h2>
  <p id="notice-body" class="notice-body"></p>
  <button id="notice-ok" class="btn-primary"></button>
</section>

<!-- iOS install guide -->
<div id="ios-overlay" class="overlay hidden"></div>
<section id="ios-modal" class="sheet hidden" role="dialog" aria-modal="true">
  <h2 id="ios-title"></h2>
  <p id="ios-body"></p>
  <button id="ios-close" class="btn-primary"></button>
</section>

<div id="toast" class="toast hidden" role="status"></div>

<script type="module" src="/js/i18n.js"></script>
<script type="module" src="/js/scene.js"></script>
<script type="module" src="/js/ambient.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
