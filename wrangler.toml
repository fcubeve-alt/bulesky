name = "bulesky"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "bulesky-db"
# Replace with the ID printed by `wrangler d1 create bulesky-db`.
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Workers AI — used by /api/report to judge a reported whisper or reply.
# If this binding is missing, reporting still works: the report counter and the
# three-report auto-hide are unaffected, only the "hide immediately" path is.
[ai]
binding = "AI"

# Finished readings (the Listen audio). OPTIONAL — and it must stay commented
# out until the bucket actually exists, because Pages fails a deploy on a
# binding it cannot resolve, and a site going dark over a storage change is a
# bad trade.
#
# Audio currently lives in D1, sliced into rows, in the same database the sky
# and the reading view query on every tap. That is fine at today's size (55
# readings, 9.3MB) and it is the first thing that breaks at App scale — this
# project has already had one round of "the whole site got slow" caused by
# audio sitting next to the whispers.
#
# To switch it on:
#   1. npx wrangler r2 bucket create bulesky-voice
#   2. uncomment the three lines below and deploy
#   3. check https://cubewithin.com/api/voice/1?probe=1 says "store": "r2"
#
# Nothing has to be migrated. Reads try R2 and then D1, so readings made before
# the bucket existed keep playing; new ones are written to R2.
#
# [[r2_buckets]]
# binding = "VOICE_BUCKET"
# bucket_name = "bulesky-voice"
