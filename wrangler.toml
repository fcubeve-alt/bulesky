name = "bulesky"
compatibility_date = "2024-11-01"
pages_build_output_dir = "public"

[[d1_databases]]
binding = "DB"
database_name = "bulesky-db"
# Replace with the ID printed by `wrangler d1 create bulesky-db`.
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# Workers AI — used by /api/report to judge a reported whisper or reply.
# If this binding is missing, reporting still works: the report counter and the
# three-report auto-hide are unaffected, only the "hide immediately" path is.
[ai]
binding = "AI"

# Finished readings (the Listen audio). The bucket exists now, so this is on.
#
# Audio used to live in D1, sliced into rows, in the same database the sky and
# the reading view query on every tap — and D1 storage costs 50x what R2 costs
# per GB. At 169KB a reading that is the difference between about $8 a month and
# about $0.09 at 100,000 readings, and between $117 and $2.30 at a million. R2
# also charges nothing for egress, which is the bill that would actually hurt
# when the library is measured in hundreds of gigabytes.
#
# Nothing is migrated and nothing needs to be: reads try R2 and then D1, so
# readings made before the bucket existed keep playing, and new ones are written
# to R2. Old rows age out on their own.
#
# ⚠️ Pages FAILS A DEPLOY on a binding it cannot resolve. The deploy workflow
# checks this bucket exists before it publishes, so a wrong name here stops with
# a message that names the buckets it did find, rather than with wrangler's own.
# Check it landed: https://cubewithin.com/api/voice/1?probe=1 says "store":"r2"
[[r2_buckets]]
binding = "VOICE_BUCKET"
bucket_name = "bulesky-voice"
